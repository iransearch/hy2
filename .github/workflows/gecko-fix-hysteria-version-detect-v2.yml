name: Fix Hysteria version detection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gecko-fix-hysteria-version-detect-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch GECKO
        run: python3 .github/scripts/fix_hysteria_version.py
      - name: Validate shell
        run: bash -n GECKO.sh
      - name: Verify markers
        run: |
          grep -F 'hysteria_version_from_binary()' GECKO.sh
          grep -F 'version 2>&1 || true' GECKO.sh
          grep -F 'downloaded_version="$(hysteria_version_from_binary' GECKO.sh
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GECKO.sh
          git commit -m 'Fix Hysteria core version detection'
          git push origin HEAD:main
