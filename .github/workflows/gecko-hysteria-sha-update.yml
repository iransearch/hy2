name: Fix Hysteria SHA update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gecko-hysteria-sha-update.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch GECKO
        run: python3 .github/scripts/fix_hysteria_sha_update.py
      - name: Validate shell
        run: bash -n GECKO.sh
      - name: Verify markers
        run: |
          grep -F 'HYSTERIA_CORE_VERSION_FILE="/var/lib/gecko/hysteria-core-version"' GECKO.sh
          grep -F 'trusted official SHA-256 verification instead' GECKO.sh
          grep -F 'hysteria_record_core_version "$latest"' GECKO.sh
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GECKO.sh
          git commit -m 'Use release SHA for Hysteria core update validation'
          git push origin HEAD:main
