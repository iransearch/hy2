name: One-time GECKO Hysteria core updater patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gecko-hysteria-core-update.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch GECKO.sh
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('GECKO.sh')
          s = p.read_text()

          marker = 'install_hysteria2_gecko_v292() {'
          if marker not in s:
              raise SystemExit('installer marker not found')

          helper = r'''hysteria_core_version() {
            local bin="/usr/local/bin/hysteria" out
            if [[ ! -x "$bin" ]]; then
              echo "not-installed"
              return 0
            fi
            out="$("$bin" version 2>/dev/null | head -n 1)"
            if [[ "$out" =~ v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              echo "v${BASH_REMATCH[1]}"
            else
              echo "unknown"
            fi
          }

          hysteria_latest_release_info() {
            local arch release_data
            case "$(uname -m)" in
              x86_64|amd64) arch="amd64" ;;
              aarch64|arm64) arch="arm64" ;;
              i386|i486|i586|i686) arch="386" ;;
              armv7l|armv7) arch="armv7" ;;
              armv6l|armv6) arch="armv6" ;;
              riscv64|s390x) arch="$(uname -m)" ;;
              *) echo "Unsupported CPU architecture: $(uname -m)" >&2; return 1 ;;
            esac

            command -v jq >/dev/null 2>&1 || { echo "jq is required." >&2; return 1; }
            release_data="$(
              curl -fsSL --retry 3 --connect-timeout 15 \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                -H 'Cache-Control: no-cache' \
                -H 'User-Agent: GECKO-Hysteria-updater' \
                'https://api.github.com/repos/apernet/hysteria/releases?per_page=20' |
              jq -r --arg asset "hysteria-linux-${arch}" '
                [
                  .[]
                  | select(.draft == false and .prerelease == false)
                  | select(.tag_name | startswith("app/v"))
                  | . as $release
                  | $release.assets[]?
                  | select(.name == $asset)
                  | {
                      published_at: $release.published_at,
                      tag: $release.tag_name,
                      url: .browser_download_url,
                      digest: (.digest // "")
                    }
                ]
                | sort_by(.published_at)
                | reverse
                | first
                | select(. != null)
                | [.tag, .url, .digest]
                | @tsv
              '
            )" || return 1
            [[ -n "$release_data" ]] || { echo "No compatible stable Hysteria release found." >&2; return 1; }
            printf '%s\n' "$release_data"
          }

          hysteria_latest_version() {
            local info tag url digest
            info="$(hysteria_latest_release_info)" || return 1
            IFS=$'\t' read -r tag url digest <<<"$info"
            [[ "$tag" =~ ^app/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || return 1
            echo "${tag#app/}"
          }

          update_hysteria2_gecko_core() {
            local bin="/usr/local/bin/hysteria" info tag url digest latest current
            local tmp_dir new_bin backup_bin expected_sha actual_sha downloaded_version
            local was_active="false"

            clear
            echo "======================================================="
            echo " Hysteria2 Core Update - Preserve Config / Accounts"
            echo "======================================================="
            [[ "$(id -u)" -eq 0 ]] || { echo "Please run as root."; return 1; }
            [[ -x "$bin" ]] || { echo "Hysteria core is not installed yet."; return 1; }

            current="$(hysteria_core_version)"
            echo "Current Core: $current"
            echo "Checking official apernet/hysteria stable releases..."

            info="$(hysteria_latest_release_info)" || { echo "Could not determine latest Hysteria release."; return 1; }
            IFS=$'\t' read -r tag url digest <<<"$info"
            latest="${tag#app/}"
            echo "Latest Core : $latest"

            if [[ "$current" == "$latest" ]]; then
              echo "Already latest. No files were changed."
              return 0
            fi

            tmp_dir="$(mktemp -d /tmp/gecko-hysteria-core.XXXXXX)" || return 1
            new_bin="$tmp_dir/hysteria.new"
            backup_bin="$tmp_dir/hysteria.old"

            if ! curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$new_bin" "$url"; then
              rm -rf "$tmp_dir"
              echo "Core download failed. Existing installation is unchanged."
              return 1
            fi
            chmod 0755 "$new_bin"

            if [[ "$digest" =~ ^sha256:([0-9A-Fa-f]{64})$ ]]; then
              expected_sha="${BASH_REMATCH[1],,}"
              actual_sha="$(sha256sum "$new_bin" | awk '{print $1}')"
              if [[ "$actual_sha" != "$expected_sha" ]]; then
                rm -rf "$tmp_dir"
                echo "SHA-256 verification failed. Existing installation is unchanged."
                return 1
              fi
              echo "SHA-256 verified."
            fi

            downloaded_version="$("$new_bin" version 2>/dev/null | head -n 1)"
            if [[ ! "$downloaded_version" =~ ${latest#v} ]]; then
              rm -rf "$tmp_dir"
              echo "Downloaded binary version check failed. Existing installation is unchanged."
              return 1
            fi

            cp -a "$bin" "$backup_bin" || { rm -rf "$tmp_dir"; return 1; }
            systemctl is-active --quiet hysteria2-gecko.service && was_active="true"

            if ! install -m 0755 "$new_bin" "$bin"; then
              rm -rf "$tmp_dir"
              echo "Could not replace Hysteria core. Existing binary is unchanged."
              return 1
            fi

            if [[ "$was_active" == "true" ]]; then
              if ! systemctl restart hysteria2-gecko.service || ! systemctl is-active --quiet hysteria2-gecko.service; then
                echo "New core failed to start. Rolling back old core..."
                install -m 0755 "$backup_bin" "$bin" || true
                systemctl restart hysteria2-gecko.service >/dev/null 2>&1 || true
                rm -rf "$tmp_dir"
                echo "Rollback completed. Core: $(hysteria_core_version)"
                return 1
              fi
            fi

            gecko_configure_hysteria_service_logging >/dev/null 2>&1 || true
            rm -rf "$tmp_dir"
            echo "Update successful."
            echo "Core Before: $current"
            echo "Core After : $(hysteria_core_version)"
            echo "Config/accounts preserved: /etc/hysteria2 was not modified."
          }

          '''

          if 'update_hysteria2_gecko_core() {' not in s:
              s = s.replace(marker, helper + marker, 1)

          # Make fresh installs use the newest official stable Hysteria release.
          old = '  HYSTERIA_VERSION="v2.9.2"'
          new = '  HYSTERIA_VERSION="$(hysteria_latest_version)" || { echo "Could not determine latest stable Hysteria core."; return 1; }'
          if old in s:
              s = s.replace(old, new, 1)

          # The current release URL format accepts app%2FvX.Y.Z.
          s = s.replace('echo " Hysteria2 v2.9.2 + Gecko Obfuscation Installer"', 'echo " Hysteria2 ${HYSTERIA_VERSION} + Gecko Obfuscation Installer"', 1)
          s = s.replace('echo " Uninstall Hysteria2 v2.9.2 + Gecko"', 'echo " Uninstall Hysteria2 + Gecko"', 1)

          # Always show installed core version on option 3 in the main menu.
          main_menu_old = 'echo -e "3)  \\e[96mInstall Hysteria2 v2.9.2 + Gecko + Masquerade\\e[0m"'
          main_menu_new = 'echo -e "3)  \\e[96mHysteria2 + Gecko + Masquerade [Core: $(hysteria_core_version)]\\e[0m"'
          if main_menu_old in s:
              s = s.replace(main_menu_old, main_menu_new, 1)
          elif '[Core: $(hysteria_core_version)]' not in s:
              raise SystemExit('main option 3 label not found')

          # Replace only the installed-Hysteria management submenu.
          submenu_re = re.compile(
              r'(?P<i>[ \t]*)echo " 1\) [^"\n]*"\n'
              r'(?P=i)echo " 2\) Uninstall"\n'
              r'(?P=i)echo " 0\) Cancel"\n'
              r'(?P=i)echo "=+"\n'
              r'(?P=i)read -rp "Choose: " HY2_MANAGE_CHOICE\n'
              r'(?P=i)case "\$HY2_MANAGE_CHOICE" in\n'
              r'(?P=i)[ \t]*1\) clear; install_hysteria2_gecko_v292 ;;\n'
              r'(?P=i)[ \t]*2\) clear; uninstall_hysteria2_gecko_v292 ;;\n'
              r'(?P=i)[ \t]*\*\) echo "Cancelled\." ;;\n'
              r'(?P=i)esac'
          )
          m = submenu_re.search(s)
          if m:
              i = m.group('i')
              replacement = (
                  f'{i}echo " 1) Update Core only (Current: $(hysteria_core_version))"\n'
                  f'{i}echo " 2) Reinstall / Repair Hysteria2 + Gecko"\n'
                  f'{i}echo " 3) Uninstall"\n'
                  f'{i}echo " 0) Cancel"\n'
                  f'{i}echo "======================================================="\n'
                  f'{i}read -rp "Choose: " HY2_MANAGE_CHOICE\n'
                  f'{i}case "$HY2_MANAGE_CHOICE" in\n'
                  f'{i}  1) clear; update_hysteria2_gecko_core ;;\n'
                  f'{i}  2) clear; install_hysteria2_gecko_v292 ;;\n'
                  f'{i}  3) clear; uninstall_hysteria2_gecko_v292 ;;\n'
                  f'{i}  *) echo "Cancelled." ;;\n'
                  f'{i}esac'
              )
              s = s[:m.start()] + replacement + s[m.end():]
          elif 'Update Core only (Current: $(hysteria_core_version))' not in s:
              raise SystemExit('Hysteria installed-management submenu not found')

          p.write_text(s)
          PY

          bash -n GECKO.sh

          grep -F 'update_hysteria2_gecko_core()' GECKO.sh
          grep -F 'HYSTERIA_VERSION="$(hysteria_latest_version)"' GECKO.sh
          grep -F 'Update Core only (Current: $(hysteria_core_version))' GECKO.sh
          grep -F 'Core: $(hysteria_core_version)' GECKO.sh

      - name: Commit GECKO.sh
        shell: bash
        run: |
          if git diff --quiet -- GECKO.sh; then
            echo "GECKO.sh already contains the requested patch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GECKO.sh
          git commit -m "Update Hysteria core safely from option 3"
          git push origin HEAD:main
